model_list:
  - model_name: orchestrator-model
    litellm_params:
      model: openrouter/anthropic/claude-sonnet-4.5
      api_key: os.environ/OPENROUTER_API_KEY

  - model_name: assistant-model
    litellm_params:
      model: openrouter/openai/gpt-4o-mini
      api_key: os.environ/OPENROUTER_API_KEY

  - model_name: researcher-model
    litellm_params:
      model: openrouter/google/gemini-2.5-flash-lite
      api_key: os.environ/OPENROUTER_API_KEY

  - model_name: methodist-model
    litellm_params:
      model: openrouter/anthropic/claude-sonnet-4.5
      api_key: os.environ/OPENROUTER_API_KEY

  - model_name: finance-model
    litellm_params:
      model: openrouter/openai/gpt-4o-mini
      api_key: os.environ/OPENROUTER_API_KEY

  - model_name: critic-model
    litellm_params:
      model: openrouter/anthropic/claude-sonnet-4.5
      api_key: os.environ/OPENROUTER_API_KEY

  - model_name: memory-curator-model
    litellm_params:
      model: openrouter/google/gemini-2.5-flash-lite
      api_key: os.environ/OPENROUTER_API_KEY

litellm_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  drop_params: true
  set_verbose: false
  json_logs: true
  request_timeout: 60
  num_retries: 2
  fallbacks:
    - {"orchestrator-model": ["methodist-model", "assistant-model"]}
    - {"assistant-model": ["critic-model", "researcher-model"]}
    - {"researcher-model": ["critic-model", "assistant-model"]}
    - {"methodist-model": ["assistant-model", "researcher-model"]}
    - {"finance-model": ["critic-model", "assistant-model"]}
    - {"critic-model": ["assistant-model", "researcher-model"]}
    - {"memory-curator-model": ["assistant-model", "researcher-model"]}
